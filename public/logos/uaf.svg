<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 80">
  <!-- Background -->
  <rect width="160" height="80" fill="white" rx="4"/>
  <rect x="1" y="1" width="158" height="78" fill="none" stroke="#333" stroke-width="1" rx="4"/>
  <!-- Globe -->
  <circle cx="40" cy="40" r="26" fill="none" stroke="#4fb3d9" stroke-width="2"/>
  <ellipse cx="40" cy="40" rx="16" ry="26" fill="none" stroke="#4fb3d9" stroke-width="1.2"/>
  <line x1="14" y1="30" x2="66" y2="30" stroke="#4fb3d9" stroke-width="1"/>
  <line x1="14" y1="50" x2="66" y2="50" stroke="#4fb3d9" stroke-width="1"/>
  <!-- UAF text -->
  <text x="90" y="52" font-family="Arial" font-weight="bold" font-size="26" fill="#1a1a1a">UAF</text>
  <!-- Red accent -->
  <rect x="88" y="44" width="6" height="12" fill="#c41e3a"/>
  <!-- United Accreditation Foundation -->
  <text x="115" y="20" font-family="Arial" font-weight="bold" font-size="7" fill="#1a1a1a">UNITED</text>
  <text x="115" y="30" font-family="Arial" font-weight="bold" font-size="7" fill="#1a1a1a">ACCREDITATION</text>
  <text x="115" y="40" font-family="Arial" font-weight="bold" font-size="7" fill="#1a1a1a">FOUNDATION</text>
</svg>
