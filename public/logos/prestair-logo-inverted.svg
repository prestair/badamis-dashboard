  <!-- White background -->
  <rect width="550" height="180" fill="white"/>
  
  <!-- PS circle (was red, now light grey) -->
  <circle cx="380" cy="55" r="38" fill="#d0d0d0"/>
  <!-- PS text inside circle -->
  <text x="380" y="68" font-family="Georgia, serif" font-weight="bold" font-style="italic" font-size="38" fill="#1a3a6b" text-anchor="middle">PS</text>
  
  <!-- Prestair text - bold italic dark blue -->
  <text x="20" y="70" font-family="Georgia, serif" font-weight="bold" font-style="italic" font-size="62" fill="#1a3a6b">Prestair</text>
  
  <!-- Systems LLP text -->
  <text x="20" y="120" font-family="Arial, sans-serif" font-weight="bold" font-size="38" fill="#1a3a6b">Systems LLP</text>
  
  <!-- SINCE 1982 text -->
